services:
  alibaba:
    build:
        context: .
        dockerfile: Dockerfile
    ports:
      - '8080:8080'
    environment:
      DEBUG: 'False'
      APP_MODE: 'Production'
      DJANGO_SECRET: $DJANGO_SECRET
      PDB_USER: $PDB_USER
      PDB_PASS: $PDB_PASS
      PDB_NAME: $PDB_NAME
      PDB_PORT: $PDB_PORT
      PDB_HOST: alibaba-pdb
      REDIS_HOST: alibaba-redis
      REDIS_PORT: 6379
      EMAIL_ADDRESS: $EMAIL_ADDRESS
      EMAIL_PASSWORD: $EMAIL_PASSWORD
      GUNICORN_WORKER_NUMBER: $MY_SERVICE_GUNICORN_WORKER_NUMBER
      GUNICORN_TIMEOUT: $MY_SERVICE_GUNICORN_TIMEOUT
    depends_on:
      - alibaba-pdb

  alibaba-pdb:
    image: ${DOCKER_REG:-}postgres:16
    environment:
      POSTGRES_USER: $PDB_USER
      POSTGRES_PASSWORD: $PDB_PASS
      POSTGRES_DB: $PDB_NAME
    ports:
      - "5432:5432" 
    volumes:
      - alibaba_local_db_mount:/var/lib/postgresql/data
      
  alibaba-redis:
    image: redis:7
    ports:
      - '6379:6379'

volumes:
  alibaba_local_db_mount: {}